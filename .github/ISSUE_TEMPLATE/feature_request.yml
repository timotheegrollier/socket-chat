name: Feature request
description: Suggest an improvement for Socket Chat
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap in the README and on the About page before opening a request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat (frontend)
        - Socket / realtime (Cloudflare Worker)
        - REST API (Express / MongoDB)
        - Deployment / CI
        - Other
    validations:
      required: true
