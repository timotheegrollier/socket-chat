name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-cloudflare
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: ${{ vars.API_URL || 'https://socket-chat.sitizstorm.workers.dev' }}
      SOCKET_URL: ${{ vars.SOCKET_URL || 'https://socket-chat.sitizstorm.workers.dev' }}
      GITHUB_IMAGES_TOKEN: ${{ secrets.GITHUB_IMAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          # The public frontend lives on GitHub Pages. Keep the Cloudflare
          # copy self-contained as a fallback (root-relative assets).
          PUBLIC_URL: /
        run: |
          npm ci
          node -e "const fs=require('fs');fs.writeFileSync('src/config.json', JSON.stringify({api_url: process.env.API_URL, socket_url: process.env.SOCKET_URL}))"
          npm run build

      - name: Warn when Cloudflare credentials are missing
        if: env.CF_API_TOKEN == ''
        run: |
          echo "::warning title=Cloudflare deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings -> Secrets and variables -> Actions, then re-run this workflow."

      - name: Deploy worker + assets to Cloudflare
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: socket-server-cloudflare
          wranglerVersion: '4.156.2'
          command: deploy

      - name: Warn when the GitHub image token is missing
        if: env.CF_API_TOKEN != '' && env.GITHUB_IMAGES_TOKEN == ''
        run: |
          echo "::warning title=Image upload disabled::Add GITHUB_IMAGES_TOKEN (a fine-grained or classic token with contents:write on this repository) in Settings -> Secrets and variables -> Actions, then re-run this workflow."

      - name: Push worker secrets
        if: env.CF_API_TOKEN != '' && env.GITHUB_IMAGES_TOKEN != ''
        working-directory: socket-server-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node -e "const fs=require('fs');const data={GITHUB_TOKEN:process.env.GITHUB_IMAGES_TOKEN};if(process.env.JWT_SECRET){data.JWT_SECRET=process.env.JWT_SECRET}fs.writeFileSync('/tmp/worker-secrets.json',JSON.stringify(data))"
          npx --yes wrangler@4.156.2 secret bulk /tmp/worker-secrets.json
          rm -f /tmp/worker-secrets.json

      - name: Smoke test production
        if: env.CF_API_TOKEN != ''
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS https://socket-chat.sitizstorm.workers.dev/health \
              && curl -fsS https://socket-chat.sitizstorm.workers.dev/api/channels | grep -q '"channels"'; then
              exit 0
            fi
            sleep 3
          done
          echo "Production health check failed"
          exit 1
