name = "socket-chat"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
VERSION = "2.2.9"

[assets]
directory = "../client/build"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "TCHAT"
class_name = "ChatRoom"

[[r2_buckets]]
binding = "CHAT_IMAGES"
bucket_name = "chat-images"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
